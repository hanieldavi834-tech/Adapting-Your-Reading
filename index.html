<style>
:root{--bg:#F4F0E8;--s1:#DCE7E2;--s2:#E9DCCB;--s3:#D8DCE5;--paper:#FFFEFA;--tx:#424A46;--mu:#6b746e;--ln:#e0d9cb;--ac:#8a6f4d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#242220;--s1:#2f3532;--s2:#3a3329;--s3:#2e323b;--paper:#2c2a27;--tx:#e6e1d6;--mu:#a19c91;--ln:#3b3834;--ac:#d1b184;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#242220;--s1:#2f3532;--s2:#3a3329;--s3:#2e323b;--paper:#2c2a27;--tx:#e6e1d6;--mu:#a19c91;--ln:#3b3834;--ac:#d1b184;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px) + 64px;height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 Inter,system-ui,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3,.serif{font-family:Lora,Georgia,serif;font-weight:600;line-height:1.25}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:center;justify-content:space-between;padding:.7rem 1.2rem}
.brand{font:600 1.1rem Lora,Georgia,serif;color:var(--tx);text-decoration:none}
nav{display:flex;gap:1.1rem;flex-wrap:wrap;font-size:.92rem}
nav a,nav span{color:var(--mu);text-decoration:none;padding:.15rem 0;border-bottom:2px solid transparent}
nav a.on{color:var(--tx);border-color:var(--ac)}nav .ok::after{content:" ✓";color:var(--ac)}nav .lk{opacity:.6}
#bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 54px);left:0;height:3px;background:var(--ac);width:0;z-index:11}
main{max-width:720px;margin:0 auto;padding:2rem 1.2rem 4rem}main.wide{max-width:980px}
.kicker{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}

.catalog{background:var(--s2);padding:1.2rem 1.4rem;border-radius:4px;margin:2rem 0}

.paper{background:var(--paper);padding:1.6rem 1.5rem;border-radius:4px;font:1.12rem/1.9 Georgia,Lora,serif}
.paper p{margin:0 0 1.2em}.notice{text-align:center;font:600 .95rem Inter,sans-serif;letter-spacing:.15em;border:1px solid var(--ln);display:inline-block;padding:.5rem 1.2rem;margin-left:50%;transform:translateX(-50%)!important}
#sel{position:sticky;bottom:1rem;background:var(--s3);padding:.6rem 1rem;border-radius:4px;margin-top:1rem;display:none;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.9rem}
.lockbox{background:var(--s3);padding:1.2rem 1.4rem;border-radius:4px;margin-top:2.5rem}

.idx button.on{border-color:var(--ac);color:var(--tx);background:var(--s1)}
.entry{border-bottom:1px solid var(--ln);padding:.8rem 0}.entry h4{margin:0;font:600 1.1rem Lora,Georgia,serif}.entry small{color:var(--mu);font:400 .8rem Inter,sans-serif;margin-left:.5rem}
.entry p{margin:.2rem 0}.ctx{color:var(--mu);font-style:italic}

.opt.ok{background:var(--s1);border-color:var(--ac)}.opt.no{background:var(--s2)}
.fb{background:var(--s2);padding:1rem 1.2rem;border-radius:4px;margin:1rem 0}

const T=[
"EVERY afternoon, as they were coming from school, the children used to go and play in the Giant’s garden.",
"It was a large lovely garden, with soft green grass. Here and there over the grass stood beautiful flowers like stars, and there were twelve peach-trees that in the springtime broke out into delicate blossoms of pink and pearl, and in the autumn bore rich fruit. The birds sat on the trees and sang so sweetly that the children used to stop their games in order to listen to them. ‘How happy we are here!’ they cried to each other.",
"One day the Giant came back. He had been to visit his friend the Cornish ogre, and had stayed with him for seven years. After the seven years were over he had said all that he had to say, for his conversation was limited, and he determined to return to his own castle. When he arrived he saw the children playing in the garden.",
"‘What are you doing there?’ he cried in a very gruff voice, and the children ran away.",
"‘My own garden is my own garden,’ said the Giant; ‘any one can understand that, and I will allow nobody to play in it but myself.’ So he built a high wall all round it, and put up a notice-board.",
"§",
"He was a very selfish Giant.",
"The poor children had now nowhere to play. They tried to play on the road, but the road was very dusty and full of hard stones, and they did not like it. They used to wander round the high wall when their lessons were over, and talk about the beautiful garden inside. ‘How happy we were there,’ they said to each other.",
"Then the Spring came, and all over the country there were little blossoms and little birds. Only in the garden of the Selfish Giant it was still winter. The birds did not care to sing in it as there were no children, and the trees forgot to blossom. Once a beautiful flower put its head out from the grass, but when it saw the notice-board it was so sorry for the children that it slipped back into the ground again, and went off to sleep. The only people who were pleased were the Snow and the Frost. ‘Spring has forgotten this garden,’ they cried, ‘so we will live here all the year round.’ The Snow covered up the grass with her great white cloak, and the Frost painted all the trees silver. Then they invited the North Wind to stay with them, and he came. He was wrapped in furs, and he roared all day about the garden, and blew the chimney-pots down. ‘This is a delightful spot,’ he said, ‘we must ask the Hail on a visit.’ So the Hail came. Every day for three hours he rattled on the roof of the castle till he broke most of the slates, and then he ran round and round the garden as fast as he could go. He was dressed in grey, and his breath was like ice.",
"‘I cannot understand why the Spring is so late in coming,’ said the Selfish Giant, as he sat at the window and looked out at his cold white garden; ‘I hope there will be a change in the weather.’",
"But the Spring never came, nor the Summer. The Autumn gave golden fruit to every garden, but to the Giant’s garden she gave none. ‘He is too selfish,’ she said. So it was always Winter there, and the North Wind and the Hail, and the Frost, and the Snow danced about through the trees.",
"One morning the Giant was lying awake in bed when he heard some lovely music. It sounded so sweet to his ears that he thought it must be the King’s musicians passing by. It was really only a little linnet singing outside his window, but it was so long since he had heard a bird sing in his garden that it seemed to him to be the most beautiful music in the world. Then the Hail stopped dancing over his head, and the North Wind ceased roaring, and a delicious perfume came to him through the open casement. ‘I believe the Spring has come at last,’ said the Giant; and he jumped out of bed and looked out.",
"What did he see?",
"He saw a most wonderful sight. Through a little hole in the wall the children had crept in, and they were sitting in the branches of the trees. In every tree that he could see there was a little child. And the trees were so glad to have the children back again that they had covered themselves with blossoms, and were waving their arms gently above the children’s heads. The birds were flying about and twittering with delight, and the flowers were looking up through the green grass and laughing. It was a lovely scene, only in one corner it was still winter. It was the farthest corner of the garden, and in it was standing a little boy. He was so small that he could not reach up to the branches of the tree, and he was wandering all round it, crying bitterly. The poor tree was still quite covered with frost and snow, and the North Wind was blowing and roaring above it. ‘Climb up! little boy,’ said the Tree, and it bent its branches down as low as it could; but the boy was too tiny.",
"And the Giant’s heart melted as he looked out. ‘How selfish I have been!’ he said; ‘now I know why the Spring would not come here. I will put that poor little boy on the top of the tree, and then I will knock down the wall, and my garden shall be the children’s playground for ever and ever.’ He was really very sorry for what he had done.",
"So he crept downstairs and opened the front door quite softly, and went out into the garden. But when the children saw him they were so frightened that they all ran away, and the garden became winter again. Only the little boy did not run, for his eyes were so full of tears that he did not see the Giant coming. And the Giant stole up behind him and took him gently in his hand, and put him up into the tree. And the tree broke at once into blossom, and the birds came and sang on it, and the little boy stretched out his two arms and flung them round the Giant’s neck, and kissed him. And the other children, when they saw that the Giant was not wicked any longer, came running back, and with them came the Spring. ‘It is your garden now, little children,’ said the Giant, and he took a great axe and knocked down the wall. And when the people were going to market at twelve o’clock they found the Giant playing with the children in the most beautiful garden they had ever seen.",
"All day long they played, and in the evening they came to the Giant to bid him good-bye.",
"‘But where is your little companion?’ he said: ‘the boy I put into the tree.’ The Giant loved him the best because he had kissed him.",
"‘We don’t know,’ answered the children; ‘he has gone away.’",
"‘You must tell him to be sure and come here to-morrow,’ said the Giant. But the children said that they did not know where he lived, and had never seen him before; and the Giant felt very sad.",
"Every afternoon, when school was over, the children came and played with the Giant. But the little boy whom the Giant loved was never seen again. The Giant was very kind to all the children, yet he longed for his first little friend, and often spoke of him. ‘How I would like to see him!’ he used to say.",
"Years went over, and the Giant grew very old and feeble. He could not play about any more, so he sat in a huge armchair, and watched the children at their games, and admired his garden. ‘I have many beautiful flowers,’ he said; ‘but the children are the most beautiful flowers of all.’",
"One winter morning he looked out of his window as he was dressing. He did not hate the Winter now, for he knew that it was merely the Spring asleep, and that the flowers were resting.",
"Suddenly he rubbed his eyes in wonder, and looked and looked. It certainly was a marvellous sight. In the farthest corner of the garden was a tree quite covered with lovely white blossoms. Its branches were all golden, and silver fruit hung down from them, and underneath it stood the little boy he had loved.",
"Downstairs ran the Giant in great joy, and out into the garden. He hastened across the grass, and came near to the child. And when he came quite close his face grew red with anger, and he said, ‘Who hath dared to wound thee?’ For on the palms of the child’s hands were the prints of two nails, and the prints of two nails were on the little feet.",
"‘Who hath dared to wound thee?’ cried the Giant; ‘tell me, that I may take my big sword and slay him.’",
"‘Nay!’ answered the child; ‘but these are the wounds of Love.’",
"‘Who art thou?’ said the Giant, and a strange awe fell on him, and he knelt before the little child.",
"And the child smiled on the Giant, and said to him, ‘You let me play once in your garden, to-day you shall come with me to my garden, which is Paradise.’",
"And when the children ran in that afternoon, they found the Giant lying dead under the tree, all covered with white blossoms."];
const D={
vocab:["Vocabulário essencial",[["garden","substantivo","jardim","“the Giant’s garden” — o lugar central da história."],["wall","substantivo","muro","“he built a high wall” — símbolo do isolamento."],["castle","substantivo","castelo","“return to his own castle”."],["blossom","substantivo/verbo","flor (de árvore) / florescer","“the tree broke at once into blossom”."],["frost","substantivo","geada","“the Frost painted all the trees silver”."],["linnet","substantivo","pintarroxo (um pássaro)","“a little linnet singing” — dica: o texto diz “bird”."],["casement","substantivo","janela (antiga, de abrir)","“through the open casement”."]]],
cog:["Palavras que você provavelmente já conhece",[["music","cognato","música","“some lovely music”."],["perfume","cognato","perfume","“a delicious perfume”."],["paradise","cognato","paraíso","“my garden, which is Paradise”."],["companion","cognato","companheiro(a)","“your little companion”."],["beautiful","palavra familiar","bonito, lindo","aparece em “the most beautiful flowers of all”."],["notice","⚠ falso amigo","aviso, placa (não “notícia”)","“a notice-board” — cuidado: parecido não é igual."]]],
verb:["Verbos (Verbs)",[["came back","base: come back · passado simples","voltou","“One day the Giant came back.” Ação concluída que abre a narrativa."],["had stayed","base: stay · past perfect","tinha ficado","had + particípio: algo que aconteceu antes do retorno."],["built","base: build · passado irregular","construiu","“So he built a high wall.” Consequência da decisão dele."],["ran away","base: run away · passado irregular","fugiram","Efeito da voz do Gigante sobre as crianças."],["melted","base: melt · passado simples","derreteu","“his heart melted” — sentido figurado: ele se comoveu."],["knocked down","base: knock down · passado irregular","derrubou","“knocked down the wall” — o muro cai."]]],
adj:["Adjetivos (Adjectives)",[["selfish","adjetivo","egoísta","Define o Gigante no início e explica o inverno."],["gruff","adjetivo","áspero, rude","“a very gruff voice” — você ouve o tom antes de ver a cena."],["delicate","adjetivo","delicado","“delicate blossoms of pink and pearl” — imagem suave e frágil."],["tiny","adjetivo","minúsculo","“the boy was too tiny” — mostra sua fragilidade."],["feeble","adjetivo","fraco, debilitado","“very old and feeble” — a passagem do tempo."]]],
con:["Conectivos (Connectors)",[["and","adição","e","“…and the children ran away.” Soma ações em sequência."],["but","contraste","mas","“But the Spring never came” — quebra a expectativa."],["so","consequência","então, por isso","“So he built a high wall.”"],["as","causa","porque, como","“…did not care to sing in it as there were no children.”"],["when","tempo","quando","“when it saw the notice-board” — marca o momento da reação."],["yet","contraste","porém, ainda assim","“very kind… yet he longed for his first little friend.”"],["for","causa (formal)","pois","“for his eyes were so full of tears” — aqui, for = because."]]]};
D.subst=["Substantivos (Nouns)",[["Giant","personagem","gigante","Com maiúscula, funciona como nome do personagem."],["children","personagens","crianças","Plural irregular de child."],["ogre","personagem","ogro","“his friend the Cornish ogre”."],["road","lugar","estrada","“the road was very dusty”."],["market","lugar","feira, mercado","“going to market at twelve o’clock”."],["axe","objeto","machado","“a great axe” — usado para derrubar o muro."],["armchair","objeto","poltrona","“a huge armchair”."],["North Wind / Hail / Snow","natureza personificada","Vento Norte / Granizo / Neve","Escritos com maiúscula: agem como personagens."],["anger","sentimento","raiva","“his face grew red with anger”."],["awe","sentimento","temor reverente","“a strange awe fell on him”."],["Love","conceito","Amor","“the wounds of Love”."]],"<p>Substantivos nomeiam pessoas, lugares, coisas e ideias. Pista: costumam vir depois de <em>the</em>, <em>a</em>, <em>his</em> ou de um adjetivo (the <strong>garden</strong>, a beautiful <strong>flower</strong>).</p>"];
D.pron=["Pronomes (Pronouns)",[["he","pronome pessoal","ele","“he determined to return to his own castle” — he = the Giant."],["they","pronome pessoal","eles, elas","“‘How happy we are here!’ they cried” — they = the children."],["it","pronome pessoal (coisas)","ele, ela","“it slipped back into the ground” — it = the flower."],["him","pronome objeto","o, lhe","“took him gently in his hand” — him = the little boy."],["his","possessivo","dele","“his own castle” — pertence ao Gigante."],["myself","reflexivo","eu mesmo","“nobody… but myself” — só o Gigante."],["thou / thee","pronome antigo","tu / te","“Who art thou?” — forma solene, hoje fora de uso."]],"<p>Pronomes substituem substantivos. Descobrir a quem eles se referem evita se perder na história.</p>"];
D.exp=["Expressões e combinações",[["all the year round","expressão","o ano inteiro","“we will live here all the year round”."],["for ever and ever","expressão","para todo o sempre","“playground for ever and ever”."],["went off to sleep","verbo + preposição","adormeceu","Não é “foi embora”: off indica passagem ao estado de sono."],["stole up behind","phrasal verb","aproximou-se sem ser notado","Aqui stole não é “roubou”."],["broke out into","collocation","desabrochou em","“broke out into delicate blossoms”."],["bid good-bye","expressão formal","despedir-se","“to bid him good-bye”."],["I would like to see him","desejo","como eu gostaria de vê-lo","would like expressa desejo."]],"<p>Algumas combinações não se entendem traduzindo palavra por palavra. Procure o sentido da expressão inteira.</p>"];
D.estr=["Estrutura das frases",[["The children ran away.","Sujeito + verbo","The children (sujeito) · ran away (verbo). Frase simples.","Comece sempre achando o verbo."],["So he built a high wall all round it.","So + sujeito + verbo + complemento","he (sujeito) · built (verbo) · a high wall (complemento). So indica consequência.","Conectivos no início mostram como a frase se liga à anterior."],["The birds did not care to sing in it as there were no children.","Oração principal + subordinada","Principal: The birds did not care to sing. Subordinada (as…): explica o motivo.","Procure a palavra que abre a segunda parte: as, when, because."],["…it was so sorry for the children that it slipped back into the ground again.","so … that","“tão triste que…”: causa e resultado ligados na mesma frase.","so + adjetivo + that = intensidade com consequência."],["For on the palms of the child’s hands were the prints of two nails.","Ordem invertida","O sujeito é the prints of two nails e vem depois do verbo were.","Quando o lugar abre a frase, o sujeito pode ficar no final."]],"<p>Para ler uma frase longa, separe: <strong>quem</strong> (sujeito), <strong>o que faz</strong> (verbo) e <strong>o resto</strong> (complemento).</p>"];
D.kw=["Palavras-chave",[["wall","início: o conflito","Separa o Gigante das crianças e do mundo.","“So he built a high wall”."],["selfish","início e meio","Define o caráter do Gigante, até virar parte do nome dele.","“the Selfish Giant”."],["winter","meio: a consequência","É o efeito do egoísmo; no fim vira “o Inverno é a Primavera adormecida”.","“it was always Winter there”."],["melted","virada","Marca o momento da transformação.","“the Giant’s heart melted”."],["kissed","virada","O gesto de afeto liga o Gigante ao menino.","“and kissed him”."],["nails","final","Revela a identidade simbólica do menino.","“the prints of two nails”."],["Paradise","final","Resolve a história: o Gigante é recompensado.","“my garden, which is Paradise”."]],"<p>São palavras que carregam o sentido de cada parte da história. Se você as entende, entende o caminho do enredo.</p>"];
const TR=[
"Todas as tardes, ao voltarem da escola, as crianças costumavam ir brincar no jardim do Gigante.",
"Era um jardim grande e lindo, de grama macia e verde. Aqui e ali, sobre a grama, havia flores belas como estrelas, e doze pessoegueiros que, na primavera, se cobriam de delicadas flores cor-de-rosa e cor de pérola, e no outono davam frutos fartos. Os pássaros pousavam nas árvores e cantavam tão docemente que as crianças interrompiam as brincadeiras para escutá-los. “Como somos felizes aqui!”, diziam umas às outras.",
"Um dia o Gigante voltou. Tinha ido visitar seu amigo, o ogro da Cornualha, e ficara com ele sete anos. Passados os sete anos, já dissera tudo o que tinha a dizer, pois sua conversa era limitada, e resolveu voltar ao seu castelo. Quando chegou, viu as crianças brincando no jardim.",
"“O que estão fazendo aí?”, gritou com uma voz muito áspera, e as crianças fugiram.",
"“Meu jardim é meu jardim”, disse o Gigante; “qualquer um entende isso, e não vou permitir que ninguém brinque nele além de mim.” Então construiu um muro alto ao redor e colocou uma placa.",
"PROIBIDA A ENTRADA · INVASORES SERÃO PROCESSADOS",
"Era um Gigante muito egoísta.",
"As pobres crianças agora não tinham onde brincar. Tentaram brincar na estrada, mas ela era muito empoeirada e cheia de pedras duras, e elas não gostaram. Ao fim das aulas, costumavam rondar o muro alto e conversar sobre o belo jardim do outro lado. “Como éramos felizes lá”, diziam umas às outras.",
"Então chegou a Primavera, e por todo o país surgiram pequenas flores e passarinhos. Só no jardim do Gigante Egoísta ainda era inverno. Os pássaros não queriam cantar ali, pois não havia crianças, e as árvores esqueceram de florir. Certa vez, uma linda flor pôs a cabeça para fora da grama, mas, ao ver a placa, sentiu tanta pena das crianças que voltou a se esconder na terra e foi dormir. As únicas que ficaram contentes foram a Neve e a Geada. “A Primavera esqueceu este jardim”, gritaram, “então vamos morar aqui o ano inteiro.” A Neve cobriu a grama com seu grande manto branco, e a Geada pintou todas as árvores de prata. Depois convidaram o Vento Norte para ficar com elas, e ele veio. Vinha envolto em peles, rugia o dia inteiro pelo jardim e derrubou as chaminés. “Este lugar é encantador”, disse ele, “precisamos convidar o Granizo para uma visita.” E o Granizo veio. Todos os dias, durante três horas, tamborilava no telhado do castelo até quebrar quase todas as telhas, e depois corria em volta do jardim o mais rápido que podia. Vestia-se de cinza, e seu hálito era como gelo.",
"“Não consigo entender por que a Primavera está demorando tanto”, disse o Gigante Egoísta, sentado à janela, olhando para o seu jardim frio e branco; “espero que o tempo mude.”",
"Mas a Primavera nunca veio, nem o Verão. O Outono deu frutos dourados a todos os jardins, mas ao jardim do Gigante não deu nenhum. “Ele é egoísta demais”, disse. Assim, ali era sempre Inverno, e o Vento Norte, o Granizo, a Geada e a Neve dançavam entre as árvores.",
"Certa manhã, o Gigante estava deitado, acordado, quando ouviu uma música encantadora. Soava tão doce aos seus ouvidos que ele pensou serem os músicos do rei passando por ali. Na verdade era apenas um pintarroxo cantando do lado de fora da janela, mas fazia tanto tempo que ele não ouvia um pássaro cantar em seu jardim que lhe pareceu a música mais bela do mundo. Então o Granizo parou de dançar sobre sua cabeça, o Vento Norte deixou de rugir, e um perfume delicioso chegou até ele pela janela aberta. “Acho que a Primavera finalmente chegou”, disse o Gigante; e pulou da cama e olhou para fora.",
"O que ele viu?",
"Viu uma cena maravilhosa. Por um pequeno buraco no muro, as crianças tinham entrado e estavam sentadas nos galhos das árvores. Em cada árvore que ele podia ver havia uma criança. E as árvores estavam tão felizes por ter as crianças de volta que se cobriram de flores e balançavam os braços suavemente sobre a cabeça delas. Os pássaros voavam de um lado para o outro, chilreando de alegria, e as flores espiavam por entre a grama verde, rindo. Era uma cena adorável, só que num canto ainda era inverno. Era o canto mais distante do jardim, e nele havia um menino pequeno. Ele era tão pequeno que não alcançava os galhos da árvore, e andava ao redor dela, chorando amargamente. A pobre árvore ainda estava coberta de geada e neve, e o Vento Norte soprava e rugia sobre ela. “Suba, menininho!”, disse a Árvore, e curvou os galhos o mais baixo que pôde; mas o menino era pequeno demais.",
"E o coração do Gigante se derreteu ao olhar para fora. “Como fui egoísta!”, disse ele; “agora sei por que a Primavera não queria vir aqui. Vou colocar aquele pobre menino no alto da árvore, depois vou derrubar o muro, e meu jardim será o parque de diversões das crianças para todo o sempre.” Estava realmente arrependido do que fizera.",
"Desceu a escada na ponta dos pés, abriu a porta da frente bem devagar e saiu para o jardim. Mas, quando as crianças o viram, ficaram tão assustadas que todas fugiram, e o jardim voltou a ser inverno. Só o menino não correu, pois seus olhos estavam tão cheios de lágrimas que ele não viu o Gigante se aproximar. E o Gigante chegou por trás dele, pegou-o com delicadeza na mão e o pôs na árvore. A árvore floresceu de imediato, os pássaros vieram cantar nela, e o menino estendeu os dois bracinhos, envolveu o pescoço do Gigante e o beijou. E as outras crianças, ao ver que o Gigante não era mais malvado, voltaram correndo, e com elas veio a Primavera. “O jardim agora é de vocês, crianças”, disse o Gigante, e pegou um grande machado e derrubou o muro. E, quando as pessoas iam ao mercado, ao meio-dia, encontraram o Gigante brincando com as crianças no jardim mais bonito que já tinham visto.",
"Brincaram o dia inteiro e, à noite, vieram se despedir do Gigante.",
"“Mas onde está o seu pequeno companheiro?”, perguntou ele: “o menino que coloquei na árvore.” O Gigante gostava mais dele porque o menino o havia beijado.",
"“Não sabemos”, responderam as crianças; “ele foi embora.”",
"“Digam a ele que não deixe de vir aqui amanhã”, disse o Gigante. Mas as crianças disseram que não sabiam onde ele morava e que nunca o tinham visto antes; e o Gigante ficou muito triste.",
"Todas as tardes, quando a aula terminava, as crianças vinham brincar com o Gigante. Mas o menino que o Gigante amava nunca mais foi visto. O Gigante era muito bondoso com todas as crianças, mas sentia saudade do seu primeiro amiguinho e falava dele com frequência. “Como eu gostaria de vê-lo!”, costumava dizer.",
"Os anos passaram, e o Gigante ficou muito velho e fraco. Já não podia brincar, então sentava-se numa enorme poltrona, observava as crianças brincando e admirava seu jardim. “Tenho muitas flores bonitas”, dizia ele; “mas as crianças são as flores mais bonitas de todas.”",
"Numa manhã de inverno, olhou pela janela enquanto se vestia. Já não odiava o Inverno, pois sabia que ele era apenas a Primavera adormecida e que as flores estavam descansando.",
"De repente esfregou os olhos, espantado, e olhou, e olhou. Era certamente uma visão maravilhosa. No canto mais distante do jardim havia uma árvore coberta de lindas flores brancas. Seus galhos eram todos dourados, frutos de prata pendiam deles, e embaixo dela estava o menino que ele amara.",
"O Gigante desceu correndo, cheio de alegria, e saiu para o jardim. Atravessou a grama apressado e chegou perto da criança. E, quando chegou bem perto, seu rosto ficou vermelho de raiva, e ele disse: “Quem ousou ferir-te?” Pois nas palmas das mãos da criança havia marcas de dois pregos, e as marcas de dois pregos estavam também nos pezinhos.",

function home(){return `<p class="kicker">Biblioteca de leitura · Inglês</p><h1 style="font-size:2.4rem;margin:.3rem 0">Adapting Your Reading</h1><p class="serif" style="font-style:italic;font-size:1.2rem;color:var(--mu)">Read. Understand. Discover.</p>
<p>Muita gente tenta traduzir cada palavra de um texto em inglês e acaba dependente da tradução. Aqui o caminho é outro: <strong>não traduza primeiro, compreenda primeiro.</strong> Você lê, explora ferramentas de apoio, resolve um desafio de interpretação e só então compara com a tradução.</p>
<p><a class="btn" href="#leitura">Começar a leitura</a></p>
<div class="catalog"><div class="kicker">Texto disponível</div><h2 style="margin:.3rem 0">The Selfish Giant</h2><dl><dt>Autor</dt><dd>Oscar Wilde</dd><dt>Idioma</dt><dd>Inglês</dd><dt>Tipo</dt><dd>Conto literário (1888), texto integral</dd><dt>Fonte</dt><dd>Domínio público (edição CELT, University College Cork)</dd></dl></div>
<h3>Como funciona</h3><ol><li><strong>Leitura</strong> — o conto completo, sem tradução.</li><li><strong>Ferramentas</strong> — vocabulário, verbos, conectivos, pistas de contexto e leitura nas entrelinhas.</li><li><strong>Desafio</strong> — perguntas de compreensão, vocabulário e inferência, com feedback.</li><li><strong>Tradução</strong> — liberada na página de leitura ao concluir o desafio.</li></ol>`}

<div class="paper" id="txt">${T.map(p=>p==="§"?`<p><span class="notice">TRESPASSERS<br>WILL BE<br>PROSECUTED</span></p>`:`<p>${p}</p>`).join("")}</div>

 const all=Object.values(D).flatMap(d=>d[1]);let c="";
 if(tab==="expl"){c=`<h2>Explorador de palavras</h2><input type="search" id="q" placeholder="Procure uma palavra do conto (ex.: wall, gruff, jardim)" autocomplete="off" value="${qry.replace(/"/g,"&quot;")}" oninput="qry=this.value;sr()"><div id="res">${resHtml()}</div>`}
 else if(tab==="pist")c=`<h2>Pistas de contexto</h2><p>Antes de ver o significado, tente deduzir pelo que está ao redor da palavra.</p>`+CL.map(x=>`<p class="serif">${x[0]}</p><p>Palavra: <strong>${x[1]}</strong></p><details><summary>Preciso de uma pista</summary>${x[2]}</details><details><summary>Ver resposta</summary>${x[3]}</details>`).join("");
 else if(tab==="entr")c=`<h2>Reading Between the Lines</h2><p>Nem tudo está dito de forma direta. Tente responder mentalmente antes de abrir.</p>`+BL.map(x=>`<p class="serif"><strong>${x[0]}</strong></p><details><summary>Ver interpretação</summary>${x[1]}</details>`).join("");
 else c=`<h2>${D[tab][0]}</h2>${D[tab][2]||""}`+D[tab][1].map(ent).join("");
 return `<p class="kicker">Etapa 2 · Ferramentas</p><div class="tools"><div class="idx">${tabs.map(t=>`<button class="${t[0]===tab?"on":""}" onclick="tab='${t[0]}';route2()">${t[1]}</button>`).join("")}</div><div>${c}<p style="margin-top:2rem"><a class="btn g" href="#leitura">Voltar ao texto</a> <a class="btn" href="#desafio">Ir para o desafio</a></p></div></div>`}

 const all=Object.entries(D).filter(e=>e[0]!=="estr").flatMap(e=>e[1][1]),r=all.filter(e=>nz(e[0]+" "+e[2]).includes(n)),x=n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),re=new RegExp("\\b"+x+"\\b","i"),rg=new RegExp("\\b"+x+"\\b","gi"),ss=sents().filter(s=>re.test(s)),c=(T.join(" ").match(rg)||[]).length;

function trHtml(){return `<h2 style="margin-top:0">Tradução</h2><p>Compare com o original abrindo e fechando cada parágrafo. A tradução é uma etapa de consolidação, não um substituto da leitura.</p><p><button class="btn g" onclick="document.querySelectorAll('#tr details').forEach(d=>d.open=true)">Expandir todos</button> <button class="btn g" onclick="document.querySelectorAll('#tr details').forEach(d=>d.open=false)">Recolher todos</button></p>`+TR.map((t,i)=>`<details ${i<3?"open":""}><summary>Parágrafo ${i+1}</summary><p class="serif ctx" style="font-style:normal">${T[i]==="§"?"TRESPASSERS WILL BE PROSECUTED":T[i]}</p><p>${t}</p></details>`).join("")+`<h3>Diferenças estruturais</h3><ul><li>Em inglês o sujeito é sempre explícito (“he cried”); em português podemos omiti-lo.</li><li>“had stayed” (past perfect) indica algo anterior ao retorno: “tinha ficado”.</li><li>“so … that” vira “tão … que”: causa e consequência na mesma frase.</li><li>“thou”, “thee”, “hath” e “art” são formas antigas e solenes; aqui aparecem em “ferir-te” e “quem és tu”.</li></ul><p><button class="btn g" onclick="resetP()">Reiniciar progresso</button></p>`}
